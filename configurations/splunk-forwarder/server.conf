# Splunk Universal Forwarder - server.conf
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\server.conf
# Purpose: Override the cached hostname so Splunk sees this host correctly
#
# Without this, the forwarder uses the original Windows hostname
# (e.g., DESKTOP-XXXXXX) instead of the renamed one (WIN-TARGET).

[general]
serverName = WIN-TARGET
