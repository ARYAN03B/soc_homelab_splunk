# Splunk Enterprise - server.conf
# Location: /opt/splunk/etc/system/local/server.conf
# Purpose: Lower the minFreeSpace threshold for lab use
#
# By default, Splunk stops indexing if free disk drops below 5GB.
# For a homelab with limited VM disk space, this can silently break ingestion.
# We lower it to 2GB to keep things flowing.
#
# DO NOT use this setting in production — it can risk data loss when disks fill.

[diskUsage]
minFreeSpace = 2000
